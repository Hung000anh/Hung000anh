name: Daily Arcade Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Chọn game của hôm nay
      - name: Pick today's game
        id: pick
        run: |
          GAMES=(pacman breakout galaga puzzle-bobble bomberman minesweeper)
          RANDOM_INDEX=$(( RANDOM % ${#GAMES[@]} ))
          GAME=${GAMES[$RANDOM_INDEX]}
          echo "game=$GAME" >> "$GITHUB_OUTPUT"
          echo "Today's game: $GAME"

      # Step 3: Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 4: Cài CLI và generate SVG
      - name: Generate Arcade Contribution SVGs
        run: |
          npm install -g pacman-contribution-graph
          mkdir -p dist
          pacman-contribution-graph \
            --platform github \
            --username ${{ github.repository_owner }} \
            --game ${{ steps.pick.outputs.game }} \
            --gameTheme github \
            --output dist/github-arcade.svg
          pacman-contribution-graph \
            --platform github \
            --username ${{ github.repository_owner }} \
            --game ${{ steps.pick.outputs.game }} \
            --gameTheme github-dark \
            --output dist/github-arcade-dark.svg

      # Step 5: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT  }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update arcade contribution game [skip ci]"
