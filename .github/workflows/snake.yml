name: Daily Arcade Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Pick today's game
      - name: Pick today's game
        id: pick
        run: |
          GAMES=(pacman breakout galaga puzzle-bobble bomberman minesweeper)
          RANDOM_INDEX=$(( RANDOM % ${#GAMES[@]} ))
          GAME=${GAMES[$RANDOM_INDEX]}
          echo "game=$GAME" >> "$GITHUB_OUTPUT"
          echo "Today's game: $GAME"

      # Step 3: Generate SVGs
      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: ${{ steps.pick.outputs.game }}

      # Step 4: Remove month labels
      - name: Remove month labels
        run: |
          for file in dist/*.svg; do
            sed -i '/>Jan</d' "$file"
            sed -i '/>Feb</d' "$file"
            sed -i '/>Mar</d' "$file"
            sed -i '/>Apr</d' "$file"
            sed -i '/>May</d' "$file"
            sed -i '/>Jun</d' "$file"
            sed -i '/>Jul</d' "$file"
            sed -i '/>Aug</d' "$file"
            sed -i '/>Sep</d' "$file"
            sed -i '/>Oct</d' "$file"
            sed -i '/>Nov</d' "$file"
            sed -i '/>Dec</d' "$file"
          done

      # Step 5: Rename generated files
      - name: Rename SVGs
        run: |
          mv dist/${{ steps.pick.outputs.game }}-contribution-graph.svg dist/github-arcade.svg
          mv dist/${{ steps.pick.outputs.game }}-contribution-graph-dark.svg dist/github-arcade-dark.svg

      # Step 6: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update arcade contribution game [skip ci]"