name: Daily Arcade Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Chọn game của hôm nay
      - name: Pick today's game
        id: pick
        run: |
          GAMES=(pacman breakout galaga puzzle-bobble bomberman minesweeper)
          RANDOM_INDEX=$(( RANDOM % ${#GAMES[@]} ))
          GAME=${GAMES[$RANDOM_INDEX]}
          echo "game=$GAME" >> "$GITHUB_OUTPUT"
          echo "Today's game: $GAME"

      # Step 3: Generate SVGs using Official Action (Bypasses API limits)
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: ${{ steps.pick.outputs.game }}
          hide_month_labels: 'true'

      # Step 4: Rename generated files to match our README
      - name: Rename SVGs
        run: |
          mv dist/${{ steps.pick.outputs.game }}-contribution-graph.svg dist/github-arcade.svg
          mv dist/${{ steps.pick.outputs.game }}-contribution-graph-dark.svg dist/github-arcade-dark.svg

      # Step 5: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT  }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update arcade contribution game [skip ci]"
