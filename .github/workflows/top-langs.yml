name: Update Top Languages SVG

on:
  schedule:
    - cron: "0 2 * * *" # Tự động chạy lúc 00:00 mỗi ngày
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Top Languages SVG
        env:
          PAT_1: ${{ secrets.GH_PAT }}
        run: |
          git clone --branch v2.6.0 https://github.com/anuraghazra/github-readme-stats.git temp-stats
          cd temp-stats
          npm ci
          node -e "
            const { fetchTopLanguages } = require('./src/fetchers/top-languages-fetcher');
            const { renderTopLanguageCard } = require('./src/cards/top-languages-card');
            const fs = require('fs');

            async function run() {
              const topLangs = await fetchTopLanguages('Hung000anh', ['jupyter notebook']);
              const svg = renderTopLanguageCard(topLangs, {
                layout: 'compact',
                theme: 'react',
                hide_border: true,
                bg_color: '1F222E',
                title_color: 'F85D7F',
                icon_color: 'F8D866',
                langs_count: 8,
              });
              fs.writeFileSync('../top-languages.svg', svg);
            }
            run();
          "
          cd ..
          rm -rf temp-stats

      - name: Commit Top Languages SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-languages.svg
          git commit -m "Update Top Languages SVG" || exit 0
          git push